<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI SAT Tutor</title>
    <link rel="stylesheet" href="vendor/katex.min.css">
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main class="panel">
      <section class="auth-view" id="auth-view">
        <div class="auth-brand">
          <p class="eyebrow">Student review</p>
          <h1>AI SAT Tutor</h1>
          <p>Sign in to save your mistake log and scheduled redos.</p>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="Account action">
          <button type="button" class="auth-tab active" id="signin-tab">Sign in</button>
          <button type="button" class="auth-tab" id="signup-tab">Create account</button>
        </div>

        <form class="auth-form" id="auth-form">
          <label for="auth-email">Email</label>
          <input id="auth-email" name="email" type="email" autocomplete="email" required>
          <label for="auth-password">Password</label>
          <input id="auth-password" name="password" type="password" autocomplete="current-password" required>
          <button type="submit" id="auth-submit">Sign in</button>
        </form>
        <button type="button" class="link-button" id="forgot-password">Forgot password?</button>
        <p class="auth-message" id="auth-message" role="status"></p>
      </section>

      <section class="app-view" id="app-view" hidden>
        <header class="header" aria-labelledby="panel-title">
          <div class="header-main">
            <div>
              <p class="eyebrow">Mistake review</p>
              <h1 id="panel-title">AI SAT Tutor</h1>
            </div>
            <button type="button" class="secondary-button" id="reset-button">New question</button>
          </div>
          <p class="status" id="status">Ready.</p>
          <div class="account-row">
            <span id="account-email"></span>
            <button type="button" class="link-button" id="signout-button">Sign out</button>
          </div>
        </header>

        <section class="due-region" id="due-region" aria-label="Scheduled reviews">
          <button type="button" class="due-summary" id="due-summary" aria-expanded="false">
            <span id="due-summary-text">No reviews due</span>
            <span aria-hidden="true">⌄</span>
          </button>
          <div class="due-list" id="due-list" hidden></div>
        </section>

        <section class="messages" id="messages" aria-live="polite" aria-label="Tutor chat"></section>

        <section class="review-entry" id="review-entry">
          <button type="button" id="review-button">Review this question</button>
          <p>Use this for a missed question or a correct answer you guessed on.</p>
        </section>

        <section class="review-controls" id="review-controls" hidden></section>

        <section class="redo-controls" id="redo-controls" hidden>
          <button type="button" id="check-redo-button">Check redo result</button>
          <p>Reattempt the saved question and reveal the correct answer first.</p>
        </section>

        <form class="composer" id="tutor-form" hidden>
          <label for="student-message">Message</label>
          <textarea
            id="student-message"
            name="studentMessage"
            rows="4"
            placeholder="Answer the tutor's question or ask a follow-up..."
          ></textarea>
          <button type="submit" id="explain-button">Send follow-up</button>
        </form>
      </section>
    </main>

    <script src="reviewFlow.js"></script>
    <script src="vendor/marked.umd.js"></script>
    <script src="vendor/katex.min.js"></script>
    <script src="rendering.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
